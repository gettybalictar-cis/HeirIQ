<script>
// =====================================================================================
// HeirIQ calculation engine — inlined per the single-file index.html architecture
// decision (Design Spec v8 §1). This is a faithful copy of the tested modules under
// src/engine/ (validated against all six HeirIQ-Test-Scenarios scenarios) — keep the
// two in sync if either changes. See src/engine/*.js for the module-by-module version
// with full per-file legal-citation commentary.
// =====================================================================================
const Engine = (function () {
  const STANDARD_DEDUCTION = 5000000;
  const FAMILY_HOME_DEDUCTION_CAP = 10000000;
  const ESTATE_TAX_RATE = 0.06;
  const CPA_CERTIFICATION_THRESHOLD = 5000000;
  const UNITS = { legitimateChild: 2, adoptedChild: 2, illegitimateChild: 1, spouse: 2 };
  const ACP_EFFECTIVE_DATE = "1988-08-03";
  const COMMUNITY_REGIMES = new Set(["ACP", "CPG"]);

  function resolveMaritalRegime({ status, marriageDate, hasPrenup, prenupRegime, voidImpediment, remarriedWithoutLiquidation }) {
    if (status === "void") return voidImpediment === "no" ? "void_union_147" : "void_union_148";
    if (remarriedWithoutLiquidation) return "forced_separation";
    if (hasPrenup && prenupRegime) return prenupRegime;
    const acpStart = new Date(ACP_EFFECTIVE_DATE);
    return new Date(marriageDate) >= acpStart ? "ACP" : "CPG";
  }
  function communityShareFraction(maritalRegime) {
    return COMMUNITY_REGIMES.has(maritalRegime) ? 0.5 : 1.0;
  }

  function isDoubleCountedRealProperty(asset) {
    return asset.category === "real_property" && asset.ownershipStructure === "via_business_entity";
  }
  function decedentShareOfAsset(asset, maritalRegime) {
    if (isDoubleCountedRealProperty(asset)) return 0;
    const isExclusiveByTiming = asset.acquisitionTiming !== "during_marriage_effort_income";
    if (isExclusiveByTiming) return asset.value.value;
    if (maritalRegime === "void_union_147") return asset.value.value * 0.5;
    if (maritalRegime === "void_union_148") {
      const fraction = asset.voidUnionEstimatedShareFraction;
      return typeof fraction === "number" ? asset.value.value * fraction : 0;
    }
    return asset.value.value * communityShareFraction(maritalRegime);
  }
  function calculateGrossEstate(assets, maritalRegime) {
    return assets.reduce((sum, a) => sum + decedentShareOfAsset(a, maritalRegime), 0);
  }
  function calculateFamilyHomeDeduction(assets, maritalRegime) {
    const share = assets
      .filter((a) => a.category === "real_property" && a.isFamilyHome === true && a.natureOfUse === "primary_residence")
      .reduce((sum, a) => sum + decedentShareOfAsset(a, maritalRegime), 0);
    return Math.min(share, FAMILY_HOME_DEDUCTION_CAP);
  }
  function calculateNetTaxableEstate(grossEstate, familyHomeDeduction, liabilitiesTotal) {
    return Math.max(0, grossEstate - STANDARD_DEDUCTION - familyHomeDeduction - (liabilitiesTotal || 0));
  }
  function calculateEstateTax(netTaxableEstate) { return netTaxableEstate * ESTATE_TAX_RATE; }
  function requiresCPACertification(grossEstate) { return grossEstate > CPA_CERTIFICATION_THRESHOLD; }

  function hasAnyMinorHeir(heirs) {
    const all = [...heirs.legitimateChildren, ...heirs.adoptedChildren, ...heirs.illegitimateChildren];
    return all.some((c) => c.isMinor === true);
  }
  function isEJSEligible({ hasWill, liabilities, heirs }) {
    return !hasWill && liabilities.length === 0 && !hasAnyMinorHeir(heirs);
  }

  function isDecedentsBiologicalChild(c) { return c.biologicalParent === "self" || c.biologicalParent === "both"; }
  function countDecedentsIllegitimateChildren(list) { return list.filter(isDecedentsBiologicalChild).length; }
  function classifyIllegitimateChild(child) {
    if (child.biologicalParent === "both") {
      if (child.legitimationImpediment === "no") return "legitimated";
      if (child.legitimationImpediment === "yes") return "illegitimate";
      return "unclear";
    }
    if (child.biologicalParent === "self") return "illegitimate";
    return "none";
  }
  function classifyIllegitimateChildren(list) {
    let legitimatedCount = 0, illegitimateSelfCount = 0; const unclearChildIds = [];
    for (const child of list) {
      const c = classifyIllegitimateChild(child);
      if (c === "legitimated") legitimatedCount++;
      else if (c === "illegitimate") illegitimateSelfCount++;
      else if (c === "unclear") unclearChildIds.push(child.id);
    }
    return { legitimatedCount, illegitimateSelfCount, unclearChildIds };
  }

  function calculateIntestateUnits({ heirs, spouseEligible }) {
    const legitimateCount = heirs.legitimateChildren.length;
    const adoptedCount = heirs.adoptedChildren.length;
    const { legitimatedCount, illegitimateSelfCount, unclearChildIds } = classifyIllegitimateChildren(heirs.illegitimateChildren);
    const effectiveLegitimateCount = legitimateCount + adoptedCount + legitimatedCount;
    const totalUnits = UNITS.legitimateChild * effectiveLegitimateCount + UNITS.illegitimateChild * illegitimateSelfCount + (spouseEligible ? UNITS.spouse : 0);
    return { legitimateCount, adoptedCount, legitimatedCount, illegitimateSelfCount, unclearChildIds, effectiveLegitimateCount, spouseEligible, totalUnits };
  }
  function calculateIntestateLegitime({ collatedBase, heirs, spouseEligible }) {
    const units = calculateIntestateUnits({ heirs, spouseEligible });
    const valuePerUnit = units.totalUnits === 0 ? 0 : collatedBase / units.totalUnits;
    const entitlements = [];
    for (const c of heirs.legitimateChildren) entitlements.push({ heirId: c.id, label: c.label, heirType: "legitimateChild", grossEntitlement: UNITS.legitimateChild * valuePerUnit });
    for (const c of heirs.adoptedChildren) entitlements.push({ heirId: c.id, label: c.label, heirType: "adoptedChild", grossEntitlement: UNITS.adoptedChild * valuePerUnit });
    for (const c of heirs.illegitimateChildren) {
      const cls = classifyIllegitimateChild(c);
      if (cls === "legitimated") entitlements.push({ heirId: c.id, label: c.label, heirType: "legitimatedChild", grossEntitlement: UNITS.legitimateChild * valuePerUnit });
      else if (cls === "illegitimate") entitlements.push({ heirId: c.id, label: c.label, heirType: "illegitimateChild", grossEntitlement: UNITS.illegitimateChild * valuePerUnit });
    }
    if (spouseEligible) entitlements.push({ heirId: "spouse", label: "Spouse", heirType: "spouse", grossEntitlement: UNITS.spouse * valuePerUnit });
    return { units, valuePerUnit, entitlements };
  }
  function assertEqualChildEntitlements(entitlements) {
    const amounts = entitlements.filter((e) => e.heirType === "legitimateChild" || e.heirType === "adoptedChild" || e.heirType === "legitimatedChild").map((e) => e.grossEntitlement);
    const distinct = new Set(amounts.map((v) => Math.round(v * 100)));
    if (distinct.size > 1) throw new Error("Engine bug: legitimate/adopted/legitimated children's entitlements are not equal.");
  }
  function applyCollationCatchUp({ entitlements, priorGifts, remainingEstateAtDeath }) {
    const flags = []; let totalNeededFromRemainingEstate = 0;
    const detail = entitlements.map((e) => {
      const alreadyReceived = priorGifts.filter((g) => g.heirId === e.heirId).reduce((s, g) => s + g.valueAtTimeOfGift, 0);
      const remainingEntitlement = e.grossEntitlement - alreadyReceived;
      let capped;
      if (remainingEntitlement < 0) { flags.push({ type: "gift_exceeds_entitlement", heirId: e.heirId }); capped = 0; }
      else capped = remainingEntitlement;
      totalNeededFromRemainingEstate += capped;
      return Object.assign({}, e, { alreadyReceived, remainingEntitlement, cappedRemainingEntitlement: capped });
    });
    if (totalNeededFromRemainingEstate > remainingEstateAtDeath) {
      flags.push({ type: "insufficient_estate_to_equalize", shortfall: totalNeededFromRemainingEstate - remainingEstateAtDeath });
    }
    return { detail, totalNeededFromRemainingEstate, flags };
  }
  function calculateTestateLegitimeFloor({ collatedBase, heirs, spouseEligible }) {
    const numLegitimateUnitChildren = heirs.legitimateChildren.length + heirs.adoptedChildren.length;
    const illegitimateSelfCount = countDecedentsIllegitimateChildren(heirs.illegitimateChildren);
    const legitimateChildrenPool = 0.5 * collatedBase;
    const perLegitimateOrAdoptedChildFloor = numLegitimateUnitChildren > 0 ? legitimateChildrenPool / numLegitimateUnitChildren : 0;
    const spouseFloor = spouseEligible ? perLegitimateOrAdoptedChildFloor : 0;
    const perIllegitimateChildFloor = illegitimateSelfCount > 0 ? perLegitimateOrAdoptedChildFloor / 2 : 0;
    const freePortion = collatedBase - legitimateChildrenPool - spouseFloor - perIllegitimateChildFloor * illegitimateSelfCount;
    return { legitimateChildrenPool, perLegitimateOrAdoptedChildFloor, freePortion, spouseFloor, perIllegitimateChildFloor,
      note: "These are the minimum amounts your will must give each heir. This tool cannot verify your actual will's distribution — have Getty review your will's terms against this floor." };
  }

  function isSpouseDisqualified(dq) { return dq && dq.offendingParty === "spouse"; }
  function netProfitForfeitureFlag(dq) {
    const m = dq && dq.mechanism;
    if (m !== "legal_separation" && m !== "annulment_bad_faith") return null;
    return { type: "net_profit_forfeiture_descriptive", note: "Mechanic A — descriptive only; requires community-property value at time of marriage, not computed." };
  }
  function detectFamilyHomeCoOwnershipRisk({ assets, illegitimateChildren, mode, hasArt1080Partition }) {
    const exists = countDecedentsIllegitimateChildren(illegitimateChildren) > 0;
    if (!exists) return [];
    if (mode === "testate" && hasArt1080Partition) return [];
    return assets.filter((a) => a.category === "real_property" && a.isFamilyHome === true && a.natureOfUse === "primary_residence")
      .map((a) => ({ type: "family_home_co_ownership_risk", assetId: a.id }));
  }
  function detectVoidUnionFlags(maritalRegime) {
    if (maritalRegime === "void_union_147") return [{ type: "void_union_bad_faith_not_computed" }];
    if (maritalRegime === "void_union_148") return [{ type: "void_union_art148_needs_review" }];
    return [];
  }
  function detectUnclearLegitimationFlags(ids) { return (ids || []).map((heirId) => ({ type: "legitimation_status_unclear", heirId })); }
  function detectNoEligibleHeirClassFlag(heirs) { return heirs.noEligibleHeirClass === true ? [{ type: "no_modeled_heir_class" }] : []; }

  function calculateEstate(input) {
    const heirs = input.heirs, assets = input.assets;
    const liabilities = input.liabilities || [], priorGifts = input.priorGifts || [];
    const hasWill = !!input.hasWill, disqualification = input.disqualification || null;
    const hasArt1080Partition = !!input.hasArt1080Partition;
    const liabilitiesTotal = liabilities.reduce((s, l) => s + l.value, 0);

    const grossEstate = calculateGrossEstate(assets, input.maritalRegime);
    const familyHomeDeduction = calculateFamilyHomeDeduction(assets, input.maritalRegime);
    const netTaxableEstate = calculateNetTaxableEstate(grossEstate, familyHomeDeduction, liabilitiesTotal);
    const estateTax = calculateEstateTax(netTaxableEstate);
    const cpaCertificationRequired = requiresCPACertification(grossEstate);
    const ejsEligible = isEJSEligible({ hasWill, liabilities, heirs });

    const netHereditaryEstate = grossEstate - liabilitiesTotal;
    const priorGiftsTotal = priorGifts.reduce((s, g) => s + g.valueAtTimeOfGift, 0);
    const collatedBase = netHereditaryEstate + priorGiftsTotal;
    const spouseEligible = !!heirs.spouseAlive && !isSpouseDisqualified(disqualification);

    const flags = []; let legitime;
    if (!hasWill) {
      const r = calculateIntestateLegitime({ collatedBase, heirs, spouseEligible });
      assertEqualChildEntitlements(r.entitlements);
      const cu = applyCollationCatchUp({ entitlements: r.entitlements, priorGifts, remainingEstateAtDeath: input.remainingEstateAtDeath != null ? input.remainingEstateAtDeath : netHereditaryEstate });
      flags.push.apply(flags, cu.flags);
      legitime = { mode: "intestate", units: r.units, valuePerUnit: r.valuePerUnit, entitlements: cu.detail, totalNeededFromRemainingEstate: cu.totalNeededFromRemainingEstate };
      flags.push.apply(flags, detectUnclearLegitimationFlags(r.units.unclearChildIds));
    } else {
      legitime = { mode: "testate", floor: calculateTestateLegitimeFloor({ collatedBase, heirs, spouseEligible }) };
    }

    flags.push.apply(flags, detectFamilyHomeCoOwnershipRisk({ assets, illegitimateChildren: heirs.illegitimateChildren, mode: hasWill ? "testate" : "intestate", hasArt1080Partition }));
    const ff = netProfitForfeitureFlag(disqualification); if (ff) flags.push(ff);
    flags.push.apply(flags, detectVoidUnionFlags(input.maritalRegime));
    flags.push.apply(flags, detectNoEligibleHeirClassFlag(heirs));

    return { grossEstate, standardDeduction: STANDARD_DEDUCTION, familyHomeDeduction, liabilitiesTotal, netTaxableEstate, estateTax,
      cpaCertificationRequired, ejsEligible, netHereditaryEstate, priorGiftsTotal, collatedBase, spouseEligible, legitime, flags };
  }

  return { resolveMaritalRegime, calculateEstate, decedentShareOfAsset };
})();

function buildEngineInput() {
  const m = state.marriage;
  const maritalRegime = m.status === "single" ? "ACP" : Engine.resolveMaritalRegime({
    status: m.status, marriageDate: m.marriageDate, hasPrenup: m.hasPrenup, prenupRegime: m.prenupRegime,
    voidImpediment: m.voidImpediment, remarriedWithoutLiquidation: m.status === "widowed" && m.priorMarriageLiquidated !== "yes" && m.priorMarriageLiquidated !== "",
  });
  let disqualification = null;
  if (m.status === "annulled" && m.annulmentBadFaith && m.annulmentBadFaith !== "none") {
    disqualification = { mechanism: "annulment_bad_faith", offendingParty: m.annulmentBadFaith };
  } else if (m.status === "legally_separated" && m.legalSeparationOffendingParty && m.legalSeparationOffendingParty !== "none") {
    disqualification = { mechanism: "legal_separation", offendingParty: m.legalSeparationOffendingParty };
  }
  return {
    maritalRegime, heirs: state.heirs, assets: state.assets, liabilities: state.liabilities,
    priorGifts: state.priorGifts, hasWill: state.hasWill, disqualification,
  };
}

function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function findAsset(id) { return state.assets.find((a) => a.id === id); }
function findChildList(kind) { return state.heirs[kind]; }

function bindHandlers() {
  app.querySelectorAll("select, input[type=date], input[type=email]").forEach((el) => {
    el.addEventListener("change", handleFieldChange);
  });
  app.querySelectorAll('input[type=number], input[type=text]:not([id])').forEach((el) => {
    el.addEventListener("input", handleFieldChange);
  });
  app.querySelectorAll("[data-action]").forEach((el) => {

  });

  if (gate) gate.addEventListener("click", submitAccessGate);
  const emailBtn = document.getElementById("emailResultsBtn");
  if (emailBtn) emailBtn.addEventListener("click", submitFinal);

function handleFieldChange(e) {
  const el = e.target;
  if (el.id === "accessTokenInput") { state.accessToken = el.value; return; }
  if (el.id === "marriageDate") { state.marriage.marriageDate = el.value; return; }
  if (el.id === "prenupRegime") { state.marriage.prenupRegime = el.value; return; }
  if (el.id === "voidGround") { state.marriage.voidGround = el.value; return; }
  if (el.id === "voidImpediment") { state.marriage.voidImpediment = el.value; return; }
  if (el.id === "priorMarriageLiquidated") { state.marriage.priorMarriageLiquidated = el.value; return; }
  if (el.id === "annulmentBadFaith") { state.marriage.annulmentBadFaith = el.value; return; }
  if (el.id === "legalSeparationOffendingParty") { state.marriage.legalSeparationOffendingParty = el.value; return; }
  if (el.id === "recipientEmail") { state.recipientEmail = el.value; return; }
  if (el.id === "consentCheck") { state._consent1 = el.checked; render(); return; }
  if (el.id === "consentFinalCheck") { state._consentFinal = el.checked; render(); return; }
  if (el.id === "insuranceCoverage") { state.insurance.totalCoverage = el.value; return; }

  if (el.hasAttribute("data-child-field")) {
    const kind = el.getAttribute("data-kind"), idx = +el.getAttribute("data-idx"), field = el.getAttribute("data-child-field");
    const child = findChildList(kind)[idx];
    child[field] = el.value;
    if (field === "biologicalParent") render();
    return;
  }
  if (el.hasAttribute("data-band")) {
    const cat = el.getAttribute("data-band");
    const card = el.closest(".asset-card");
    const id = card.getAttribute("data-asset-id");
    const asset = findAsset(id);
    if (el.value === "skip") { asset.value = { value: 0, confidence: "default" }; }
    else if (el.value) { asset.value = { value: Number(el.value), confidence: "estimated" }; }
    render();
    return;
  }
  if (el.hasAttribute("data-asset-field")) {
    const id = el.getAttribute("data-id"), field = el.getAttribute("data-asset-field");
    const asset = findAsset(id);
    if (field === "exactValue") { asset.value = { value: Number(el.value) || 0, confidence: "exact" }; }
    else if (field === "currency") { asset.currency = el.value; if (el.value !== "PHP") fetchFxRate(asset); render(); }
    else if (field === "originalAmount") { asset.originalAmount = Number(el.value) || 0; if (asset.currency && asset.currency !== "PHP") fetchFxRate(asset); }
    else { asset[field] = el.value; }
    return;
  }
  if (el.hasAttribute("data-liab-field")) {
    const id = el.getAttribute("data-id"), field = el.getAttribute("data-liab-field");
    const liab = state.liabilities.find((l) => l.id === id);
    liab[field] = field === "value" ? Number(el.value) || 0 : el.value;
    return;
  }
  if (el.hasAttribute("data-gift-field")) {
    const id = el.getAttribute("data-id"), field = el.getAttribute("data-gift-field");
    const gift = state.priorGifts.find((g) => g.id === id);
    gift[field] = field === "valueAtTimeOfGift" ? Number(el.value) || 0 : el.value;
    return;
  }
  saveState();
}

function handleAction(e) {
  const action = e.currentTarget.getAttribute("data-action");
  const [cmd, ...rest] = action.split(":");

  if (cmd === "go") { go(rest[0]); return; }
  if (cmd === "computeAndShowResults") { lastResult = Engine.calculateEstate(buildEngineInput()); go("results"); return; }

  if (cmd === "setStatus") { state.marriage.status = rest[0]; render(); saveState(); return; }
  if (cmd === "setBool") {
    const field = rest[0], val = rest[1] === "1";
    if (["hasPredeceasedChildWithDescendants", "hasDisputedFiliationClaim", "livingParents", "spouseAlive"].includes(field)) state.heirs[field] = val;
    else if (field === "hasWill") state.hasWill = val;
    else state.marriage[field] = val;
    render(); saveState(); return;
  }
  if (cmd === "setChild") {
    const [kind, idx, field, val] = rest;
    const child = findChildList(kind)[+idx];
    child[field] = field === "isMinor" ? val === "1" : val;
    render(); saveState(); return;
  }
  if (cmd === "addChild") {
    findChildList(rest[0]).push({ id: uid(), label: "", birthOrder: "", isMinor: false, biologicalParent: "self" });
    render(); saveState(); return;
  }
  if (cmd === "removeChild") {
    const list = findChildList(rest[0]); list.splice(+rest[1], 1);
    render(); saveState(); return;
  }
  if (cmd === "toggleIllegitimate") {
    state._showIllegitimate = rest[0] === "1";
    if (state._showIllegitimate && state.heirs.illegitimateChildren.length === 0) {
      state.heirs.illegitimateChildren.push({ id: uid(), label: "", birthOrder: "", isMinor: false, biologicalParent: "self" });
    }
    if (rest[0] === "0") state.heirs.illegitimateChildren = [];
    render(); saveState(); return;
  }

  if (cmd === "addAsset") {
    const category = rest[0];
    const asset = { id: uid(), category, value: { value: 0, confidence: "default" }, acquisitionTiming: "during_marriage_effort_income" };
    if (category === "real_property") Object.assign(asset, { isFamilyHome: false, natureOfUse: "primary_residence", ownershipStructure: "direct" });
    if (category === "financial") Object.assign(asset, { currency: "PHP", originalAmount: 0, fxRate: null, fxRateDate: null, fxRateSource: null });
    if (category === "business_shares") Object.assign(asset, { businessValuationMethod: "not_sure" });
    state.assets.push(asset);
    render(); saveState(); return;
  }
  if (cmd === "removeAsset") { state.assets = state.assets.filter((a) => a.id !== rest[0]); render(); saveState(); return; }
  if (cmd === "setAssetBool") { findAsset(rest[0])[rest[1]] = rest[2] === "1"; render(); saveState(); return; }
  if (cmd === "toggleBiz") { state._hasBizShares = rest[0] === "1"; render(); saveState(); return; }

  if (cmd === "addLiability") { state.liabilities.push({ id: uid(), description: "", value: 0 }); render(); saveState(); return; }
  if (cmd === "removeLiability") { state.liabilities = state.liabilities.filter((l) => l.id !== rest[0]); render(); saveState(); return; }

  if (cmd === "addGift") {
    const heirs = allChildHeirs();
    if (heirs.length === 0) return;
    state.priorGifts.push({ id: uid(), heirId: heirs[0].id, valueAtTimeOfGift: 0, date: "" });
    render(); saveState(); return;
  }
  if (cmd === "removeGift") { state.priorGifts = state.priorGifts.filter((g) => g.id !== rest[0]); render(); saveState(); return; }

  if (cmd === "setInsurance") { state.insurance.hasInsurance = rest[0] === "1"; render(); saveState(); return; }
}

// =====================================================================================
// Foreign-currency conversion (§3.2b, LB-10) — Frankfurter API, no personal data sent.
// =====================================================================================
async function fetchFxRate(asset) {
  try {
    const res = await fetch("https://api.frankfurter.dev/v1/latest?from=" + asset.currency + "&to=PHP");
    if (!res.ok) throw new Error("rate fetch failed");
    const data = await res.json();
    const rate = data.rates && data.rates.PHP;
    if (typeof rate !== "number") throw new Error("no PHP rate returned");
    asset.fxRate = rate; asset.fxRateDate = data.date; asset.fxRateSource = "BSP";
    asset.value = { value: (asset.originalAmount || 0) * rate, confidence: "estimated" };
  } catch (e) {
    const fallback = FX_FALLBACK_RATES[asset.currency];
    if (fallback) {
      asset.fxRate = fallback; asset.fxRateDate = "fallback"; asset.fxRateSource = "manual_entry";
      asset.value = { value: (asset.originalAmount || 0) * fallback, confidence: "estimated" };
    } else {
      asset.fxRateSource = "manual_entry";
    }
  }
  render(); saveState();
}

// =====================================================================================
// Backend integration
//
// NOTE: this sandbox's outbound network policy blocks script.google.com, so the exact
// GET/POST response contract below could not be verified against the live endpoint from
// here. The calls are written defensively (any non-throwing response is treated as
// success) — confirm the actual response shape against the live Apps Script deployment
// during a real device test pass, and tighten the success check if it returns a
// structured {ok:false} error body rather than a non-2xx status.
// =====================================================================================
async function submitAccessGate() {
  const btn = document.getElementById("accessGateSubmit");
  const errEl = document.getElementById("accessGateError");
  const token = document.getElementById("accessTokenInput").value.trim();
  state.accessToken = token;
  errEl.textContent = "";
  if (!token) { errEl.textContent = "Enter your access code to continue."; return; }
  btn.disabled = true; btn.textContent = "Checking…";
  try {
    const res = await fetch(BACKEND_URL + "?a=" + encodeURIComponent(token));
    if (!res.ok) throw new Error("access check failed");
    let valid = true;
    try { const data = await res.json(); if (data && data.valid === false) valid = false; } catch (e) { /* non-JSON 200 response is treated as valid */ }
    if (!valid) throw new Error("invalid code");
    go("landing");
  } catch (e) {
    errEl.textContent = "That code didn’t work. Please check it and try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Continue";
  }
}

async function submitFinal() {
  const btn = document.getElementById("emailResultsBtn");
  const errEl = document.getElementById("submitError");
  errEl.textContent = "";
  if (!state.recipientEmail) { go("confirmation"); return; }
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const pdfBase64 = buildResultsPdfBase64();
    // Sent as a plain-string body (default Content-Type: text/plain;charset=utf-8) to
    // avoid triggering a CORS preflight OPTIONS request against the Apps Script web app,
    // which doGet/doPost endpoints commonly don't handle.
    await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({ email: state.recipientEmail, pdfBase64 }) });
    go("confirmation");
  } catch (e) {
    errEl.textContent = "We couldn’t send your results just now — please try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Email me my results";
  }
}

function buildResultsPdfBase64() {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const r = lastResult || Engine.calculateEstate(buildEngineInput());
    let y = 20;
    doc.setFontSize(18); doc.text("HeirIQ — Estate Assessment", 14, y); y += 10;
    doc.setFontSize(11);
    doc.text("Gross estate: " + money(r.grossEstate), 14, y += 8);
    doc.text("Net taxable estate: " + money(r.netTaxableEstate), 14, y += 8);
    doc.text("Estate tax (6%): " + money(r.estateTax), 14, y += 8);
    doc.text("CPA certification required: " + (r.cpaCertificationRequired ? "Yes" : "No"), 14, y += 8);
    doc.text("EJS eligible: " + (r.ejsEligible ? "Yes" : "No"), 14, y += 8);
    y += 4;
    doc.setFontSize(13); doc.text("Legitime", 14, y += 8);
    doc.setFontSize(11);
    if (r.legitime.mode === "intestate") {
      r.legitime.entitlements.forEach((e) => { doc.text((e.label || e.heirType) + ": " + money(e.grossEntitlement), 14, y += 7); });
    } else {
      const f = r.legitime.floor;
      doc.text("Each legitimate/adopted child floor: " + money(f.perLegitimateOrAdoptedChildFloor), 14, y += 7);
      doc.text("Spouse floor: " + money(f.spouseFloor), 14, y += 7);
      doc.text("Illegitimate child floor: " + money(f.perIllegitimateChildFloor), 14, y += 7);
    }
    y += 4;
    doc.setFontSize(9);
    doc.text("Not legal or tax advice. Estimates only — verify with a professional.", 14, y += 10);
    const datauri = doc.output("datauristring");
    return datauri.split(",")[1];
  } catch (e) {
    return "";
  }
}
